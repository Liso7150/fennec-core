[workspace]
resolver = "2"
members = [
    "fennec-acp",
    "fennec-economy",
    "fennec-napi",
    "fennec-outlets",
    "fennec-preflight",
    "fennec-pyjson",
    "fennec-webview-shell",
]

[workspace.package]
version = "2.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Liso7150/fennec-core"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

fennec-acp = { path = "fennec-acp" }
fennec-economy = { path = "fennec-economy" }
fennec-outlets = { path = "fennec-outlets" }
fennec-preflight = { path = "fennec-preflight" }
fennec-pyjson = { path = "fennec-pyjson" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
