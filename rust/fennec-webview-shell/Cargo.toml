[package]
name = "fennec-webview-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The token-stream winner: Rust agent backend + system WebView2 over native IPC (no bundled browser, no SSE). Counterpart to the Chromium+SSE shell for the transport A/B."

[dependencies]
serde_json = { workspace = true }
wry = "0.57"
tao = "0.37"

[[bin]]
name = "fennec-webview-shell"
path = "src/main.rs"