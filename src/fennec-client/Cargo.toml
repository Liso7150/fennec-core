[package]
name = "fennec-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust client for the two loopback services the core owns the contract for: the fennec-core agent server (fennec-agent serve) and the Fennec engine. Ported from fennec_core/engine.py and fennec_core/server.py; the desktop and any other native shell consume it instead of re-implementing the protocol."

[dependencies]
serde.workspace = true
serde_json.workspace = true
