[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fennec-core"
version = "1.4.0"
description = "Shared Fennec service: engine client, supervised agent loop, workspace tools, PWA host."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psutil>=5.9",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]
stt = ["faster-whisper==1.2.1", "av>=14,<18"]  # PyAV 18+ removed metadata_errors that faster-whisper passes

[project.scripts]
fennec-agent = "fennec_core.server:main"

[tool.setuptools]
packages = ["fennec_core"]
