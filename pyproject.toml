[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fennec-core"
version = "1.0.0"
description = "Shared Fennec service: engine client, supervised agent loop, workspace tools, PWA host."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psutil>=5.9",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]
stt = ["faster-whisper==1.2.1", "av>=14,<18"]  # PyAV 18+ removed metadata_errors that faster-whisper passes
# Only materialising converted tensors needs numpy; classifying a folder and planning the
# conversion stay stdlib, so a machine that never converts pays nothing for it.
convert = ["numpy>=1.24"]
antigravity = ["google-antigravity>=0.1.24"]

[project.scripts]
fennec-agent = "server:main"
fennec-convert = "convert:main"

# Every module sits at the repo root, so the wheel is a list of top-level modules
# rather than one package. tests/test_packaging.py fails if this drifts from `ls *.py`.
[tool.setuptools]
py-modules = [
  "acp", "config", "context", "convert", "engine", "events", "liquid",
  "loop", "mcp", "mcp_server", "outlets", "preflight", "rust_bridge", "server", "setup_wizard",
  "snapshot", "stt", "te_bridge", "tools", "updater", "version", "web_driver", "webagent",
]
