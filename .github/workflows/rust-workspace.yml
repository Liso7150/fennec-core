name: rust-workspace

# SAC on the dev box can block freshly-built unsigned binaries, so the full
# native test run also lives here. These crates are the single implementation
# the desktop app, the JetBrains sidecar and the CLI consume by path, so CI
# checks them before any of those shells build against them.
on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/rust-workspace.yml"
  pull_request:
    paths:
      - "src/**"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Unit tests + goldens
        run: cargo test --release -p fennec-client -p fennec-outlets -p fennec-acp -p fennec-preflight -p fennec-pyjson -p fennec-workspace-tools
      - name: Build the client others path-depend on
        run: cargo build --release -p fennec-client
